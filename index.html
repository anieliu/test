<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>按鈕頁面</title>
  <style>
    button:nth-child(1) { background-color: #FF0000; color: white; }
    button:nth-child(2) { background-color: #FFA500; color: white; }
    button:nth-child(3) { background-color: #FFFF00; color: black; }
    button:nth-child(4) { background-color: #00FF00; color: black; }
    button:nth-child(5) { background-color: #00FFFF; color: black; }
    button:nth-child(6) { background-color: #0000FF; color: white; }
    button:nth-child(7) { background-color: #800080; color: white; }
    button:nth-child(8) { display: none; }
  </style>
</head>
<body>
  <button type="button">按鈕1</button>
  <button type="button">按鈕2</button>
  <button type="button">按鈕3</button>
  <button type="button">按鈕4</button>
  <button type="button">按鈕5</button>
  <button type="button">按鈕6</button>
  <button type="button">按鈕7</button>
  <button type="button">按鈕8</button>
</body>
</html>
